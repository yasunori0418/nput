# sara-gap 契約テスト用の最小モデル。実リポジトリの docs/model.yaml から、
# ギャップ検出に関与する型（仕様の系統 + リスクとテストの系統）だけを抜き出したもの。
#
# フィールド定義は一切持たない。sara-gap が読むのは item_type / id / relationships /
# source.file_path だけで、requirement に specification を定義すると sara の RFC2119
# 検証が fixture item にも波及して、検出契約と無関係な記述量が増えるため。

item_types:
  - id: solution
    display_name: Solution
    prefix: SOL
    id_format: '{prefix}-{uuid}'
    parent_types: []
    fields: []
    allowed_targets: []

  - id: use_case
    display_name: Use Case
    prefix: UC
    id_format: '{prefix}-{uuid}'
    parent_types:
      - solution
    fields: []
    allowed_targets:
      - relation: refines
        targets:
          - solution

  - id: requirement
    display_name: Requirement
    prefix: REQ
    id_format: '{prefix}-{uuid}'
    parent_types:
      - use_case
    fields: []
    allowed_targets:
      - relation: derives_from
        targets:
          - use_case

  - id: design
    display_name: Design
    prefix: DSG
    id_format: '{prefix}-{uuid}'
    parent_types:
      - requirement
    fields: []
    allowed_targets:
      - relation: satisfies
        targets:
          - requirement

  - id: risk
    display_name: Risk
    prefix: RISK
    id_format: '{prefix}-{uuid}'
    parent_types:
      - requirement
      - design
    fields: []
    allowed_targets:
      - relation: threatens
        targets:
          - requirement
          - design

  - id: test_condition
    display_name: Test Condition
    prefix: TC
    id_format: '{prefix}-{uuid}'
    parent_types:
      - risk
    fields: []
    allowed_targets:
      - relation: mitigates
        targets:
          - risk

  - id: test_case
    display_name: Test Case
    prefix: CASE
    id_format: '{prefix}-{uuid}'
    parent_types:
      - test_condition
    fields: []
    allowed_targets:
      - relation: covers
        targets:
          - test_condition

relations:
  - id: refines
    display_name: Refines
    inverse: is_refined_by
    direction: upstream
    primary: true
  - id: is_refined_by
    display_name: Is refined by
    inverse: refines
    direction: downstream
    primary: false

  - id: derives_from
    display_name: Derives from
    inverse: derives
    direction: upstream
    primary: true
  - id: derives
    display_name: Derives
    inverse: derives_from
    direction: downstream
    primary: false

  - id: satisfies
    display_name: Satisfies
    inverse: is_satisfied_by
    direction: upstream
    primary: true
  - id: is_satisfied_by
    display_name: Is satisfied by
    inverse: satisfies
    direction: downstream
    primary: false

  - id: threatens
    display_name: Threatens
    inverse: is_threatened_by
    direction: upstream
    primary: true
  - id: is_threatened_by
    display_name: Is threatened by
    inverse: threatens
    direction: downstream
    primary: false

  - id: mitigates
    display_name: Mitigates
    inverse: is_mitigated_by
    direction: upstream
    primary: true
  - id: is_mitigated_by
    display_name: Is mitigated by
    inverse: mitigates
    direction: downstream
    primary: false

  - id: covers
    display_name: Covers
    inverse: is_covered_by
    direction: upstream
    primary: true
  - id: is_covered_by
    display_name: Is covered by
    inverse: covers
    direction: downstream
    primary: false
